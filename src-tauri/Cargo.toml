[package]
name = "flachdachplaner"
version = "0.0.1"
edition = "2021"
description = "Flachdachplaner Desktop"

[lib]
name = "flachdachplaner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
strip = true
